<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>屋台レジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#173E2E;
    --navy-2:#1F5340;
    --cream:#FBF5E8;
    --cream-2:#F1E6CF;
    --gold:#C99A2E;
    --gold-2:#B3861F;
    --rust:#B5262D;
    --pine:#2E6F4E;
    --line:#E6DCC2;
    --ink:#241C10;
    --muted:#8A7F68;
    --danger:#8E1B27;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Roboto Mono', monospace;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input{font-family:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Mode select ---------- */
  .gate{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px; text-align:center;
  }
  .gate-eyebrow{color:var(--gold);letter-spacing:.2em;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:10px;}
  .gate h1{color:var(--cream);font-size:32px;font-weight:900;margin:0 0 6px;}
  .gate p{color:#C5DACD;font-size:14px;margin:0 0 36px;}
  .gate-options{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:520px;}
  .gate-card{
    background:var(--cream);width:220px;padding:26px 20px;border-radius:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .15s ease;
  }
  .gate-card:active{transform:scale(.97);}
  .gate-card .tag{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;}
  .gate-card .big{font-size:22px;font-weight:900;color:var(--navy);}
  .gate-card .desc{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .gate-card.register{border-bottom:6px solid var(--rust);}
  .gate-card.kitchen{border-bottom:6px solid var(--pine);}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--navy);color:var(--cream);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px; flex-wrap:wrap; gap:8px;
    position:relative;padding-bottom:20px;
  }
  .topbar::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:5px;
    background:repeating-linear-gradient(135deg,#B5262D 0 10px,#FBF5E8 10px 20px);
  }
  .topbar .title{display:flex;align-items:baseline;gap:10px;}
  .topbar h1{font-size:18px;font-weight:900;margin:0;}
  .topbar .sub{font-size:11px;color:#B7D0C1;font-weight:500;}
  .topbar .stats{display:flex;gap:18px;align-items:center;}
  .stat{text-align:right;}
  .stat .label{font-size:10px;color:#B7D0C1;letter-spacing:.1em;text-transform:uppercase;}
  .stat .val{font-size:18px;font-weight:700;}
  .iconbtn{
    background:rgba(255,255,255,.08);color:var(--cream);width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .iconbtn:active{background:rgba(255,255,255,.18);}
  .helpbtn{
    background:rgba(255,255,255,.14);color:var(--cream);padding:8px 14px;border-radius:18px;
    font-weight:700;font-size:12.5px;letter-spacing:.04em;
  }
  .helpbtn:active{background:rgba(255,255,255,.28);}
  .gate-help{position:fixed;top:14px;right:14px;z-index:5;}
  .help-modal{max-width:560px;}
  .help-sec{margin-bottom:18px;}
  .help-sec h4{font-size:12px;letter-spacing:.08em;color:var(--rust);margin:0 0 8px;font-weight:900;}
  .help-q{background:#fff;border-radius:8px;margin-bottom:8px;box-shadow:0 1px 0 var(--line);}
  .help-q summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;color:var(--navy);list-style:none;}
  .help-q summary::-webkit-details-marker{display:none;}
  .help-q summary::before{content:'Q';display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--rust);color:#fff;font-size:11px;font-weight:900;margin-right:8px;}
  .help-q .ans{padding:0 14px 13px 42px;font-size:13.5px;line-height:1.7;color:var(--ink);}

  /* ---------- Register layout ---------- */
  .register-wrap{flex:1;display:flex;flex-direction:column;background:#EFE6D0;}

  .register-body{flex:1;display:flex;flex-wrap:wrap;gap:0;background:var(--cream);}
  .item-grid-wrap{flex:1 1 60%; min-width:280px; padding:18px 18px 6px;}
  .grid-section{margin-bottom:22px;}
  .grid-section-head{
    display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;color:var(--navy);
    margin-bottom:12px;letter-spacing:.02em;
  }
  .grid-section-head .dot{display:inline-block;width:9px;height:9px;border-radius:50%;}
  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; align-content:start;
  }
  .item-btn{
    background:#fff;border-radius:10px;padding:16px 10px;text-align:center;
    box-shadow:0 1px 0 var(--line), 0 4px 10px rgba(36,28,16,.05);
    display:flex;flex-direction:column;gap:6px;align-items:center;
    border:2px solid transparent;
  }
  .item-btn:active{border-color:var(--gold);transform:translateY(1px);}
  .item-btn .nm{font-weight:700;font-size:14.5px;line-height:1.3;}
  .item-btn .pr{font-size:13px;color:var(--muted);}
  .item-btn.drink .nm{color:var(--rust);}
  .item-btn.postcard .nm{color:var(--pine);}
  .empty-menu{grid-column:1/-1;color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}

  .ticket-panel{
    flex:1 1 320px; max-width:400px; background:var(--navy-2); padding:16px; display:flex;flex-direction:column;
  }
  .ticket{
    background:var(--cream); position:relative; padding:18px 16px 22px;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    clip-path: polygon(
      0 0, 100% 0, 100% calc(100% - 10px),
      96% 100%, 92% calc(100% - 10px), 88% 100%, 84% calc(100% - 10px),
      80% 100%, 76% calc(100% - 10px), 72% 100%, 68% calc(100% - 10px),
      64% 100%, 60% calc(100% - 10px), 56% 100%, 52% calc(100% - 10px),
      48% 100%, 44% calc(100% - 10px), 40% 100%, 36% calc(100% - 10px),
      32% 100%, 28% calc(100% - 10px), 24% 100%, 20% calc(100% - 10px),
      16% 100%, 12% calc(100% - 10px), 8% 100%, 4% calc(100% - 10px),
      0 100%
    );
  }
  .ticket-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:10px;}
  .ticket-head .num{font-weight:900;color:var(--navy);font-size:15px;}
  .ticket-head .time{font-size:11px;color:var(--muted);}
  .ticket-lines{display:flex;flex-direction:column;gap:10px;max-height:34vh;overflow-y:auto;}
  .tline{display:flex;align-items:center;gap:8px;}
  .tline .nm{flex:1;font-size:13.5px;font-weight:500;}
  .tline .nm .tag{display:block;font-size:10px;color:var(--muted);}
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{
    width:24px;height:24px;border-radius:50%;background:var(--cream-2);color:var(--navy);font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-ctrl .q{width:20px;text-align:center;font-weight:700;font-size:13.5px;}
  .tline .amt{width:64px;text-align:right;font-size:13px;}
  .ticket-empty{color:var(--muted);font-size:12.5px;padding:14px 0;text-align:center;}
  .ticket-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:12px;padding-top:12px;}
  .ticket-total .lbl{font-size:12.5px;color:var(--muted);font-weight:700;}
  .ticket-total .amt{font-size:26px;font-weight:900;color:var(--navy);}

  .cash-row{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:12px;align-items:center;}
  .cash-row input{
    flex:1;padding:10px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;
  }
  .cash-row .change{font-size:19px;font-weight:900;white-space:nowrap;flex-basis:100%;text-align:center;padding:9px 12px;border-radius:8px;background:var(--cream);}
  .cash-row .change:empty{display:none;}
  .change.ok{color:var(--ink);}
  .change.bad{color:var(--danger);}

  .confirm-btn{
    margin-top:14px;padding:15px;border-radius:8px;background:var(--gold);color:var(--navy);
    font-weight:900;font-size:15px;text-align:center;
  }
  .confirm-btn:disabled, .confirm-btn.disabled{background:#5E8571;color:#C5DACD;}
  .confirm-btn:active:not(.disabled){background:var(--gold-2);}
  .clear-link{margin-top:10px;text-align:center;color:#C5DACD;font-size:12px;text-decoration:underline;}

  .summary{padding:14px 16px 26px;background:var(--navy-2);}
  .summary h3{color:var(--cream);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;font-weight:700;}
  .summary-row{display:flex;justify-content:space-between;color:#E3EFE7;font-size:13px;padding:4px 0;}
  .summary-row b{color:var(--cream);}
  .csv-btn{
    width:100%;margin-top:14px;padding:11px;border-radius:8px;background:var(--cream);color:var(--navy);
    font-weight:700;font-size:13px;text-align:center;
  }
  .csv-btn:active{background:var(--cream-2);}
  .csv-btn:disabled{opacity:.4;}

  .history-section{padding:16px 16px 4px;background:#EFE6D0;border-top:1px solid var(--line);}
  .history-section h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;}
  .hist-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
  .hist-row{
    background:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;
    align-items:center;box-shadow:0 1px 0 var(--line);
  }
  .hist-row.cancelled{opacity:.55;}
  .hist-main{flex:1;min-width:0;}
  .hist-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hist-num{font-weight:900;color:var(--navy);font-size:13.5px;}
  .hist-time{font-size:11.5px;color:var(--muted);}
  .hist-items{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-badge{font-size:10px;font-weight:900;padding:2px 7px;border-radius:4px;}
  .hist-badge.cancelled{background:var(--danger);color:#fff;}
  .hist-badge.edited{background:var(--gold);color:var(--navy);}
  .hist-side{text-align:right;flex-shrink:0;}
  .hist-total{font-size:14px;font-weight:700;color:var(--navy);}
  .hist-actions{display:flex;gap:6px;margin-top:6px;}
  .hist-btn{padding:6px 10px;border-radius:6px;background:var(--cream-2);color:var(--navy);font-weight:700;font-size:11.5px;}
  .hist-btn.danger{background:#F3E1DC;color:var(--danger);}

  /* ---------- Kitchen (PC2) ---------- */
  .kitchen-wrap{flex:1;background:#EFE6D0;padding:16px;display:flex;gap:16px;flex-wrap:wrap;}
  .col{flex:1;min-width:280px;}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .col-head .dot{width:12px;height:12px;border-radius:50%;}
  .col-head h2{font-size:18px;letter-spacing:.05em;font-weight:900;color:var(--navy);margin:0;text-transform:uppercase;}
  .col-head .count{font-size:14px;color:var(--muted);font-weight:600;}
  .tickets-col{display:flex;flex-direction:column;gap:14px;}
  .kticket{
    background:var(--cream);border-radius:2px;padding:18px 18px 16px;position:relative;
    box-shadow:0 6px 16px rgba(36,28,16,.14);
    border-left:7px solid var(--rust);
  }
  .kticket.done{border-left-color:var(--pine); opacity:.7;}
  .kticket.cancelled{border-left-color:var(--danger); background:#F7E7E2;}
  .kt-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .kt-head .num{font-weight:900;font-size:24px;color:var(--navy);}
  .kt-head .time{font-size:14px;color:var(--muted);font-weight:500;}
  .kt-banner{
    display:inline-block;padding:5px 12px;border-radius:5px;font-size:13px;font-weight:900;
    margin-bottom:10px;letter-spacing:.03em;
  }
  .kt-banner.cancel{background:var(--danger);color:#fff;}
  .kt-banner.edited{background:var(--gold);color:var(--navy);}
  .kt-items{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .kt-items.strike .kt-item{text-decoration:line-through;opacity:.55;}
  .kt-item{display:flex;justify-content:space-between;font-size:20px;font-weight:700;}
  .kt-item.pc{color:var(--muted);font-size:15px;font-weight:500;}
  .kt-item .q{font-weight:900;color:var(--rust);font-size:22px;}
  .kt-item.changed{
    background:#FFF1C8;border-radius:8px;padding:6px 10px;margin:0 -10px;
    box-shadow:0 0 0 2px var(--gold) inset;
  }
  .kt-item.changed .q{color:var(--gold-2);}
  .kt-item.removed .q{color:var(--danger);}
  .kt-done-btn{width:100%;padding:14px;border-radius:8px;background:var(--pine);color:#fff;font-weight:700;font-size:16px;text-align:center;}
  .kt-done-btn:active{background:#245a3e;}
  .kt-ack-btn{width:100%;padding:11px;border-radius:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:14px;text-align:center;margin-bottom:8px;}
  .kt-ack-btn:active{background:var(--gold-2);}
  .kt-cancel-ack-btn{width:100%;padding:14px;border-radius:8px;background:var(--danger);color:#fff;font-weight:800;font-size:15px;text-align:center;}
  .kt-cancel-ack-btn:active{background:#6f1420;}
  .kt-undo{width:100%;padding:8px;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;font-size:12px;text-align:center;text-decoration:underline;}
  .col-empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px;background:rgba(255,255,255,.4);border-radius:8px;}

  /* ---------- Settings modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(23,62,46,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:640px){.modal-bg{align-items:center;}}
  .modal{
    background:var(--cream);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:14px 14px 0 0;padding:20px;
  }
  @media(min-width:640px){.modal{border-radius:12px;}}
  .modal h2{font-size:16px;font-weight:900;color:var(--navy);margin:0 0 4px;}
  .modal .close{position:absolute;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head button{background:var(--cream-2);width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--navy);}
  .msec{margin-bottom:20px;}
  .msec h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700;}
  .medit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .medit-row input[type=text]{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;background:#fff;}
  .medit-row input[type=number]{width:80px;padding:9px 8px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;background:#fff;}
  .medit-row button.del{width:32px;height:32px;border-radius:6px;background:#F3E1DC;color:var(--danger);font-size:15px;flex-shrink:0;}
  .add-item-btn{width:100%;padding:10px;border-radius:6px;border:1.5px dashed var(--muted);background:transparent;color:var(--muted);font-weight:700;font-size:13px;}
  .danger-btn{width:100%;padding:12px;border-radius:8px;background:var(--danger);color:#fff;font-weight:700;font-size:13.5px;margin-top:6px;}
  .modal-note{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:var(--cream);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.3); z-index:60;
  }
  .loading{color:#C5DACD;text-align:center;padding:60px 20px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let mode = null;             // 'register' | 'kitchen'
let menu = { drinks: [], postcards: [] };
let orders = [];             // {id, num, time, items:[{id,name,type,price,qty}], total, drinkStatus}
let ticket = [];             // current in-progress order lines (register only)
let receivedValue = '';
let showSettings = false;
let showHelp = false;
let helpOpen = new Set();
let loaded = false;
let toastMsg = null;
let saving = false;
let audioCtx = null;
let knownOrderIds = new Set();
let prevOrderState = new Map();
let ordersInitialized = false;
let editingOrderId = null;   // order currently being edited (register only)
let editingLines = [];       // working line items while editing an existing order

const DEFAULT_MENU = {
  drinks: [
    { id: 'd1', name: 'ホットコーヒー', price: 300 },
    { id: 'd2', name: 'アイスティー', price: 300 },
    { id: 'd3', name: 'ココア', price: 350 },
    { id: 'd4', name: '甘酒', price: 300 }
  ],
  postcards: [
    { id: 'p1', name: 'ポストカード', price: 200 }
  ]
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function yen(n){ return '¥' + Number(n).toLocaleString('ja-JP'); }

// Force Asia/Tokyo formatting regardless of the device's own timezone setting,
// so records are consistent even if a PC's clock/timezone is misconfigured.
function jstParts(iso){
  const d = new Date(iso);
  const fmt = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
  const parts = {};
  fmt.formatToParts(d).forEach(p=>{ parts[p.type] = p.value; });
  return parts;
}
function timeLabel(iso){
  const p = jstParts(iso);
  return p.hour + ':' + p.minute;
}
function jstDateTimeLabel(iso){
  const p = jstParts(iso);
  return `${p.year}/${p.month}/${p.day} ${p.hour}:${p.minute}:${p.second}`;
}
function flash(msg){ toastMsg = msg; render(); setTimeout(()=>{ toastMsg = null; render(); }, 1800); }

// ---------------------------------------------------------------
// Storage (Firebase Firestore)
// ---------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyBUDDoL9Fsby-OUFlu1sW5mzzxGbosOcK0",
  authDomain: "regi-app-test.firebaseapp.com",
  projectId: "regi-app-test",
  storageBucket: "regi-app-test.firebasestorage.app",
  messagingSenderId: "154199347803",
  appId: "1:154199347803:web:ae594910fa005cf97e657e",
  measurementId: "G-6P8FHVBRBE"
};

let fsDoc = null, fsSetDoc = null, fsOnSnapshot = null;
let menuDocRef = null, ordersDocRef = null, settingsDocRef = null;
let menuLoaded = false, ordersLoaded = false;
let connectionError = false;
let appSettings = { sheetWebhookUrl: '', targetSheetUrl: '' };

function checkLoaded(){
  if(menuLoaded && ordersLoaded && !loaded){
    loaded = true;
  }
  render();
}

async function initFirebase(){
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const dbFs = getFirestore(app);
    fsDoc = doc; fsSetDoc = setDoc; fsOnSnapshot = onSnapshot;
    menuDocRef = fsDoc(dbFs, 'stall', 'menu');
    ordersDocRef = fsDoc(dbFs, 'stall', 'orders');
    settingsDocRef = fsDoc(dbFs, 'stall', 'settings');

    fsOnSnapshot(settingsDocRef, (snap) => {
      const d = snap.data();
      appSettings = {
        sheetWebhookUrl: (d && d.sheetWebhookUrl) || '',
        targetSheetUrl: (d && d.targetSheetUrl) || ''
      };
      render();
    }, () => {});

    fsOnSnapshot(menuDocRef, (snap) => {
      const d = snap.data();
      if(d && d.value){
        menu = JSON.parse(d.value);
      } else {
        menu = DEFAULT_MENU;
        fsSetDoc(menuDocRef, { value: JSON.stringify(DEFAULT_MENU) }).catch(()=>{});
      }
      menuLoaded = true;
      checkLoaded();
    }, (err) => { connectionError = true; menuLoaded = true; checkLoaded(); });

    fsOnSnapshot(ordersDocRef, (snap) => {
      const d = snap.data();
      const newOrders = d && d.value ? JSON.parse(d.value) : [];
      if(ordersInitialized && mode === 'kitchen'){
        let newArrival = false;
        let alertChange = false;
        newOrders.forEach(o=>{
          const prev = prevOrderState.get(o.id);
          if(!prev){
            if(o.drinkStatus !== 'na') newArrival = true;
          } else {
            const wasCancelled = prev.status === 'cancelled';
            const isCancelled = o.status === 'cancelled';
            const wasEdited = !!prev.edited;
            const isEdited = !!o.edited;
            if((isCancelled && !wasCancelled) || (isEdited && !wasEdited)) alertChange = true;
          }
        });
        if(newArrival) playNewOrderChime();
        else if(alertChange) playAlertChime();
      }
      prevOrderState = new Map(newOrders.map(o=>[o.id, { status:o.status, edited:!!o.edited }]));
      knownOrderIds = new Set(newOrders.map(o=>o.id));
      ordersInitialized = true;
      orders = newOrders;
      ordersLoaded = true;
      checkLoaded();
    }, (err) => { connectionError = true; ordersLoaded = true; checkLoaded(); });

  } catch(e){
    connectionError = true;
    menu = DEFAULT_MENU;
    orders = [];
    loaded = true;
    render();
  }
}

// Fire-and-forget backup log to a Google Apps Script Web App (Google Sheets).
// This is independent of Firestore, so it survives a "reset" of the Firestore orders doc.
// action: 'new' (append rows) | 'update' (delete old rows for this order, re-append current ones) | 'cancel' (delete rows for this order, nothing re-added)
function logOrderToSheet(order, action){
  action = action || 'new';
  if(!appSettings.sheetWebhookUrl) return;
  const rows = (action === 'cancel') ? [] : order.items.filter(l=>l.qty>0).map(l => ({
    orderNum: order.num,
    time: jstDateTimeLabel(order.time),
    name: l.name,
    type: l.type === 'drink' ? 'ドリンク' : 'ポストカード',
    price: l.price,
    qty: l.qty,
    subtotal: l.price * l.qty,
    orderTotal: order.total
  }));
  fetch(appSettings.sheetWebhookUrl, {
    method: 'POST',
    mode: 'no-cors', // Apps Script web apps don't return CORS headers; response is opaque and ignored.
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, orderNum: order.num, rows, spreadsheetUrl: appSettings.targetSheetUrl || undefined })
  }).catch(()=>{ /* silent - never block checkout on backup logging failure */ });
}

function addToTicket(catType, item){
  const existing = ticket.find(l => l.id === item.id);
  if(existing) existing.qty += 1;
  else ticket.push({ id:item.id, name:item.name, type:catType, price:item.price, qty:1 });
  render();
}
function changeQty(id, delta){
  const line = ticket.find(l=>l.id===id);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) ticket = ticket.filter(l=>l.id!==id);
  render();
}
function ticketTotal(){ return ticket.reduce((s,l)=>s + l.price*l.qty, 0); }

function updateChange(val){
  receivedValue = val;
  const el = document.getElementById('changeDisplay');
  if(!el) return;
  const received = parseInt(val, 10);
  const total = ticketTotal();
  if(isNaN(received)){ el.textContent = ''; el.className='change'; return; }
  const diff = received - total;
  if(diff < 0){ el.textContent = '不足 ' + yen(Math.abs(diff)); el.className='change bad'; }
  else { el.textContent = 'おつり ' + yen(diff); el.className='change ok'; }
}

async function confirmOrder(){
  if(ticket.length === 0 || saving) return;
  saving = true;
  const hasDrink = ticket.some(l=>l.type==='drink');
  const order = {
    id: uid('ord'),
    num: orders.length + 1,
    time: new Date().toISOString(),
    items: ticket.map(l=>({ id:l.id, name:l.name, type:l.type, price:l.price, qty:l.qty, changed:false })),
    total: ticketTotal(),
    drinkStatus: hasDrink ? 'pending' : 'na',
    status: 'active',
    edited: false
  };
  orders = [...orders, order];
  await persistOrders();

  ticket = [];

function openEditOrder(orderId){
  const o = orders.find(x=>x.id===orderId);
  if(!o || o.status === 'cancelled') return;
  editingOrderId = orderId;
  editingLines = o.items.filter(l=>l.qty>0).map(l=>({ id:l.id, name:l.name, type:l.type, price:l.price, qty:l.qty }));
  render();
}
function closeEditOrder(){
  editingOrderId = null;
  editingLines = [];
  render();
}
function editAddItem(catType, item){
  const existing = editingLines.find(l=>l.id===item.id);
  if(existing) existing.qty += 1;
  else editingLines.push({ id:item.id, name:item.name, type:catType, price:item.price, qty:1 });
  render();
}
function editChangeQty(id, delta){
  const line = editingLines.find(l=>l.id===id);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) editingLines = editingLines.filter(l=>l.id!==id);
  render();
}
async function saveOrderEdit(){
  const o = orders.find(x=>x.id===editingOrderId);
  if(!o) return;
  const oldQtyMap = {};
  o.items.forEach(l=>{ oldQtyMap[l.id] = (oldQtyMap[l.id]||0) + l.qty; });

  const newItems = editingLines.map(l=>({
    id:l.id, name:l.name, type:l.type, price:l.price, qty:l.qty,
    changed: l.qty !== (oldQtyMap[l.id] || 0)
  }));
  // items that existed before with qty>0 but are gone now -> keep as a zero-qty "removed" marker for kitchen visibility
  o.items.forEach(old=>{
    if(old.qty > 0 && !newItems.find(n=>n.id===old.id)){
      newItems.push({ id:old.id, name:old.name, type:old.type, price:old.price, qty:0, changed:true });
    }
  });

  const hasDrink = newItems.some(i=>i.type==='drink' && i.qty>0);
  const drinkChanged = newItems.some(i=>i.type==='drink' && i.changed);
  let newDrinkStatus = o.drinkStatus;
  if(!hasDrink) newDrinkStatus = 'na';
  else if(o.drinkStatus === 'na') newDrinkStatus = 'pending';
  else if(o.drinkStatus === 'done' && drinkChanged) newDrinkStatus = 'pending';

  o.items = newItems;
  o.total = newItems.reduce((s,l)=> s + l.price*l.qty, 0);
  o.drinkStatus = newDrinkStatus;
  o.edited = true;

  await persistOrders();
  logOrderToSheet(o, 'update');
  editingOrderId = null;
  editingLines = [];
  flash('No.' + o.num + ' を変更しました');
  render();
}
async function cancelOrder(orderId){
  const o = orders.find(x=>x.id===orderId);
  if(!o) return;
  if(!confirm('No.' + o.num + ' をキャンセルします。よろしいですか？')) return;
  o.status = 'cancelled';
  await persistOrders();
  logOrderToSheet(o, 'cancel');
  flash('No.' + o.num + ' をキャンセルしました');
  render();
}

function salesSummary(){
  const activeOrders = orders.filter(o=>o.status !== 'cancelled');
  const totalRevenue = activeOrders.reduce((s,o)=>s+o.total,0);
  const itemCounts = {};
  activeOrders.forEach(o=> o.items.forEach(l=>{
    if(l.qty <= 0) return;
    itemCounts[l.name] = (itemCounts[l.name]||0) + l.qty;
  }));
  const cancelledCount = orders.length - activeOrders.length;
  return { totalRevenue, orderCount: activeOrders.length, itemCounts, cancelledCount };
}
function drinkQueue(){
  return orders.filter(o=> o.drinkStatus==='pending').sort((a,b)=> new Date(a.time)-new Date(b.time));
}
function drinkDone(){
  return orders.filter(o=>o.drinkStatus==='done').sort((a,b)=> new Date(b.time)-new Date(a.time)).slice(0,12);
}
function recentOrders(){
  return [...orders].sort((a,b)=> new Date(b.time)-new Date(a.time)).slice(0,20);
}

function csvCell(val){
  const s = String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(){
  if(orders.length === 0) return;
  const rows = [['注文番号','日時','状態','商品名','分類','単価','数量','小計','注文合計']];
  orders.forEach(o=>{
    o.items.forEach(l=>{
      rows.push([
        o.num,
        jstDateTimeLabel(o.time),
        o.status==='cancelled' ? 'キャンセル' : (o.edited ? '変更あり' : '有効'),
        l.name + (l.qty===0 ? '(削除)' : ''),
        l.type==='drink' ? 'ドリンク' : 'ポストカード',
        l.price,
        l.qty,
        l.price*l.qty,
        o.total
      ]);
    });
  });
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `屋台レジ_売上_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function unlockAudio(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    else if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  } catch(e){}
}

function playNewOrderChime(){
  if(!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    // "ぴろん" - quick low-to-high two-note bell chime, louder
    const notes = [
      { freq: 1046.5, start: 0,    dur: 0.16, peak: 0.9 },  // ぴ
      { freq: 1568.0, start: 0.10, dur: 0.42, peak: 0.85 }  // ろん (rings out)
    ];
    notes.forEach(n=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.freq, now+n.start);
      gain.gain.setValueAtTime(0.0001, now+n.start);
      gain.gain.exponentialRampToValueAtTime(n.peak, now+n.start+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+n.start+n.dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+n.start); osc.stop(now+n.start+n.dur+0.02);
    });
  } catch(e){}
}

function playAlertChime(){
  if(!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    // lower, urgent double-buzz for cancellations/changes to an already-known order
    [0, 0.18].forEach(offset=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(420, now+offset);
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.5, now+offset+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.17);
    });
  } catch(e){}
}

function setMode(m){ mode = m; showSettings=false; unlockAudio(); render(); }

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div class="loading">読み込み中…</div>'; return; }
  const errBanner = connectionError
    ? '<div class="toast" style="background:var(--danger);bottom:auto;top:14px;">Firebase未接続:データは同期・保存されません(設定を確認してください)</div>'
    : '';
  const oldHelp = document.querySelector('.help-modal');
  const helpScroll = oldHelp ? oldHelp.scrollTop : 0;
  if(!mode){ app.innerHTML = renderGate() + errBanner + (showHelp ? renderHelp() : ''); restoreHelpScroll(helpScroll); return; }
  if(mode === 'register') app.innerHTML = renderRegister();
  else app.innerHTML = renderKitchen();
  app.innerHTML += errBanner;
  if(toastMsg) app.innerHTML += '<div class="toast">' + toastMsg + '</div>';
  if(showSettings) app.innerHTML += renderSettings();
  if(editingOrderId) app.innerHTML += renderEditOrderModal();
  if(showHelp) app.innerHTML += renderHelp();
  restoreHelpScroll(helpScroll);

  // re-attach change display after render (input keeps focus naturally since not re-rendered on input)
  const cd = document.getElementById('changeDisplay');
  if(cd) updateChange(receivedValue);
  const ri = document.getElementById('receivedInput');
  if(ri) ri.value = receivedValue;
}

  `).join('') : '<div class="ticket-empty">商品をタップして注文を追加</div>';

  const itemCountsHtml = Object.keys(s.itemCounts).length ? Object.entries(s.itemCounts).map(([name,qty])=>`
    <div class="summary-row"><span>${escapeHtml(name)}</span><b>${qty}点</b></div>
  `).join('') : '<div class="summary-row"><span>まだ販売実績なし</span></div>';

  const recent = recentOrders();
  const historyHtml = recent.length ? recent.map(o=>{
    const isCancelled = o.status === 'cancelled';
    const itemsSummary = o.items.filter(l=>l.qty>0).map(l=>`${escapeHtml(l.name)}×${l.qty}`).join('、') || '（品目なし）';
    const badge = isCancelled ? '<span class="hist-badge cancelled">キャンセル</span>'
      : (o.edited ? '<span class="hist-badge edited">変更あり</span>' : '');
    return `
      <div class="hist-row ${isCancelled?'cancelled':''}">
        <div class="hist-main">
          <div class="hist-top"><span class="hist-num">No.${o.num}</span><span class="hist-time mono">${timeLabel(o.time)}</span>${badge}</div>
          <div class="hist-items">${itemsSummary}</div>
        </div>
        <div class="hist-side">
          <div class="hist-total mono">${yen(o.total)}</div>
          ${isCancelled ? '' : `
            <div class="hist-actions">
              <button class="hist-btn" onclick="openEditOrder('${o.id}')">変更</button>
              <button class="hist-btn danger" onclick="cancelOrder('${o.id}')">キャンセル</button>
            </div>
          `}
        </div>
      </div>
    `;
  }).join('') : '<div class="summary-row"><span>まだ注文はありません</span></div>';

  return `
    <div class="topbar">
      <div class="title">
        <button class="iconbtn" onclick="goHome()">‹</button>
        <div><h1>レジ (PC1)</h1><div class="sub">屋台レジ</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">売上合計</div><div class="val mono">${yen(s.totalRevenue)}</div></div>
        <div class="stat"><div class="label">件数</div><div class="val mono">${s.orderCount}</div></div>
        <button class="iconbtn" onclick="showSettings=true; render();" title="設定">⚙</button>
        <button class="helpbtn" onclick="showHelp=true; render();" title="使い方・Q&A">Q&amp;A</button>
      </div>
    </div>
    <div class="register-wrap">
      <div class="register-body">
        <div class="item-grid-wrap">${itemsHtml}</div>
        <div class="ticket-panel">
          <div class="ticket">
            <div class="ticket-head">
              <div class="num">No.${orders.length+1}</div>
              <div class="time mono">${timeLabel(new Date().toISOString())}</div>
            </div>
            <div class="ticket-lines">${lines}</div>
            <div class="ticket-total">
              <div class="lbl">合計</div>
              <div class="amt mono">${yen(total)}</div>
            </div>
          </div>
          <div class="cash-row">
            <input id="receivedInput" type="number" inputmode="numeric" placeholder="預かり金額" oninput="updateChange(this.value)">
            <div id="changeDisplay" class="change"></div>
          </div>
          <button class="confirm-btn ${ticket.length===0?'disabled':''}" ${ticket.length===0?'disabled':''} onclick="confirmOrder()">会計を確定する</button>
          ${ticket.length>0 ? '<div class="clear-link" onclick="clearTicket()">この注文を取り消す</div>' : ''}
        </div>
      </div>
      <div class="history-section">
        <h3>注文履歴（変更・キャンセル）</h3>
        <div class="hist-list">${historyHtml}</div>
      </div>
      <div class="summary">
        <h3>本日の内訳${s.cancelledCount>0 ? `（キャンセル ${s.cancelledCount}件を除く）` : ''}</h3>
        ${itemCountsHtml}
        <button class="csv-btn" onclick="exportCSV()" ${orders.length===0?'disabled':''}>CSVダウンロード（${orders.length}件）</button>
      </div>
    </div>
  `;
}

function renderEditOrderModal(){
  const o = orders.find(x=>x.id===editingOrderId);
  if(!o) return '';
  const cats = [
    { key:'drink', label:'バー出し', list: menu.drinks },
    { key:'postcard', label:'レジ出し', list: menu.postcards }
  ];
  const itemButtons = cats.map(c=>{
    const buttons = c.list.length ? c.list.map(it => `
      <button class="item-btn ${c.key}" onclick="editAddItem('${c.key}', ${JSON.stringify(it).replace(/"/g,'&quot;')})">
        <div class="nm">${escapeHtml(it.name)}</div>
        <div class="pr mono">${yen(it.price)}</div>
      </button>
    `).join('') : `<div class="empty-menu">${escapeHtml(c.label)}の商品がありません</div>`;
    return `
      <div class="grid-section">
        <div class="grid-section-head"><span class="dot" style="background:${c.key==='drink'?'var(--rust)':'var(--pine)'}"></span>${c.label}</div>
        <div class="item-grid edit-grid">${buttons}</div>
      </div>
    `;
  }).join('');

  const lines = editingLines.length ? editingLines.map(l => `
    <div class="tline">
      <div class="nm">${escapeHtml(l.name)}<span class="tag">${l.type==='drink'?'バー出し':'レジ出し'} ・ ${yen(l.price)}</span></div>
      <div class="qty-ctrl">
        <button onclick="editChangeQty('${l.id}', -1)">−</button>
        <div class="q">${l.qty}</div>
        <button onclick="editChangeQty('${l.id}', 1)">＋</button>
      </div>
      <div class="amt mono">${yen(l.price*l.qty)}</div>
    </div>
  `).join('') : '<div class="ticket-empty">品目がありません</div>';

  const newTotal = editingLines.reduce((s,l)=>s+l.price*l.qty,0);

  return `
    <div class="modal-bg" onclick="if(event.target===this){closeEditOrder();}">
      <div class="modal">
        <div class="modal-head">
          <h2>No.${o.num} を変更</h2>
          <button onclick="closeEditOrder()">×</button>
        </div>
        <div class="modal-note" style="margin-bottom:14px;">保存すると、変更した品目はバー確認側で強調表示されます。すでに完成済みの注文にバー出しの品を追加した場合は、調理中キューに再度戻ります。</div>
        ${itemButtons}
        <div class="msec">
          <h4>変更後の注文内容</h4>
          <div class="ticket-lines" style="max-height:none;">${lines}</div>
          <div class="ticket-total" style="margin-top:10px;">
            <div class="lbl">合計</div>
            <div class="amt mono">${yen(newTotal)}</div>
          </div>
        </div>
        <button class="confirm-btn" onclick="saveOrderEdit()">変更を保存</button>
      </div>
    </div>
  `;
}

function renderKitchen(){
  const pending = drinkQueue();
  const done = drinkDone();

  function ticketBody(o, isDoneCard){
    const cancelled = o.status === 'cancelled';
    const edited = !cancelled && !!o.edited && o.items.some(l=>l.changed);
    const displayItems = isDoneCard ? o.items.filter(l=>l.type==='drink') : o.items;

    const itemsHtml = displayItems.map(l => {
      const removed = l.qty === 0;
      const cls = [l.type!=='drink' ? 'pc' : '', (edited && l.changed) ? 'changed' : '', removed ? 'removed' : ''].filter(Boolean).join(' ');
      const qtyLabel = l.type==='drink' ? (removed ? '削除' : '×'+l.qty) : '';
      return `<div class="kt-item ${cls}"><span>${escapeHtml(l.name)}</span><span class="q">${qtyLabel}</span></div>`;
    }).join('');

    const banner = cancelled ? '<div class="kt-banner cancel">キャンセル</div>'
      : (edited ? '<div class="kt-banner edited">内容変更あり</div>' : '');

    let actions;
    if(cancelled && !isDoneCard){
      actions = `<button class="kt-cancel-ack-btn" onclick="markDrinkDone('${o.id}')">確認して消す</button>`;
    } else if(isDoneCard){
      actions = cancelled ? '' : `<div class="kt-undo" onclick="undoDrinkDone('${o.id}')">取り消す</div>`;
    } else {
      actions = `<button class="kt-done-btn" onclick="markDrinkDone('${o.id}')">提供完了</button>`;
    }

    return `
      <div class="kticket ${isDoneCard?'done':''} ${cancelled?'cancelled':''}">
        <div class="kt-head"><div class="num">No.${o.num}</div><div class="time mono">${timeLabel(o.time)}</div></div>
        ${banner}
        <div class="kt-items ${cancelled?'strike':''}">${itemsHtml}</div>
        ${actions}
      </div>
    `;
  }

  const pendingHtml = pending.length ? pending.map(o => ticketBody(o, false)).join('') : '<div class="col-empty">待っている注文はありません</div>';
  const doneHtml = done.length ? done.map(o => ticketBody(o, true)).join('') : '<div class="col-empty">完了した注文はまだありません</div>';

  return `
    <div class="topbar">
      <div class="title">
        <button class="iconbtn" onclick="goHome()">‹</button>
        <div><h1>バー確認 (PC2)</h1><div class="sub">屋台レジ</div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">待ち件数</div><div class="val mono">${pending.length}</div></div>
        <button class="helpbtn" onclick="showHelp=true; render();" title="使い方・Q&A">Q&amp;A</button>
      </div>
    </div>
    <div class="kitchen-wrap">
      <div class="col">
        <div class="col-head"><span class="dot" style="background:var(--rust)"></span><h2>調理中</h2><span class="count">${pending.length}件</span></div>
        <div class="tickets-col">${pendingHtml}</div>
      </div>
      <div class="col">
        <div class="col-head"><span class="dot" style="background:var(--pine)"></span><h2>完成</h2><span class="count">直近${done.length}件</span></div>
        <div class="tickets-col">${doneHtml}</div>
      </div>
    </div>
  `;
}

function renderSettings(){
  function editRows(catKey, list){
    return list.map(it => `
      <div class="medit-row">
        <input type="text" value="${escapeAttr(it.name)}" onchange="updateItemField('${catKey}','${it.id}','name', this.value)">
        <input type="number" value="${it.price}" onchange="updateItemField('${catKey}','${it.id}','price', this.value)">
        <button class="del" onclick="removeMenuItem('${catKey}','${it.id}')">×</button>
      </div>
    `).join('');
  }
  return `
    <div class="modal-bg" onclick="if(event.target===this){showSettings=false; render();}">
      <div class="modal">
        <div class="modal-head">
          <h2>設定</h2>
          <button onclick="showSettings=false; render();">×</button>
        </div>
        <div class="msec">
          <h4>バー出し メニュー</h4>
          ${editRows('drinks', menu.drinks)}
          <button class="add-item-btn" onclick="addMenuItem('drinks')">＋ バー出しを追加</button>
        </div>
        <div class="msec">
          <h4>レジ出し メニュー</h4>
          ${editRows('postcards', menu.postcards)}
          <button class="add-item-btn" onclick="addMenuItem('postcards')">＋ レジ出しを追加</button>
        </div>
        <div class="msec">
          <h4>スプレッドシート バックアップ記録</h4>
          <div class="modal-note">会計確定のたびに、指定したGoogle Apps ScriptのURLへ自動送信します。Firestoreとは別経路なので、売上リセット後もスプレッドシート側の記録は残ります。</div>
          <div class="medit-row" style="margin-top:8px;">
            <input type="text" style="flex:1;" placeholder="Apps ScriptのURL(https://script.google.com/macros/s/.../exec)"
              value="${escapeAttr(appSettings.sheetWebhookUrl||'')}"
              onchange="updateWebhookUrl(this.value)">
          </div>
          <div class="medit-row">
            <input type="text" style="flex:1;" placeholder="書き込み先スプレッドシートのURL(空欄ならスクリプト側の既定シート)"
              value="${escapeAttr(appSettings.targetSheetUrl||'')}"
              onchange="updateTargetSheetUrl(this.value)">
          </div>
          <div class="modal-note">上のApps Script URLは一度設定すれば使い回せます。イベントごとに新しいスプレッドシートを使う場合は、下の欄だけ差し替えてください(そのスプレッドシートに、Apps Scriptを作成したGoogleアカウントの編集権限が必要です)。</div>
        </div>
        <div class="msec">
          <h4>データ</h4>
          <div class="modal-note">レジと確認画面はリアルタイムで同期します。イベント終了後、次のリセットで本日の注文データ(Firestore側)を消去できます。</div>
          <button class="danger-btn" onclick="resetAllData()">売上データをリセット</button>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
render(); // show loading state immediately
initFirebase();
</script>
</body>
</html>
